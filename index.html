<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bereka Building Regulations | የበረካ ህንፃ መተዳደሪያ ደንብ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root{--bg:#f1f0fa;--card:#fff;--ink:#17262b;--mute:#5b6b70;--line:#d8e0e2;--brand:#0f4c5c;--accent:#b8741a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e171a;--card:#162226;--ink:#e6eef0;--mute:#9db0b5;--line:#2a3b40;--brand:#6fc3d6;--accent:#e0a24a}}
:root[data-theme=dark]{--bg:#0e171a;--card:#162226;--ink:#e6eef0;--mute:#9db0b5;--line:#2a3b40;--brand:#6fc3d6;--accent:#e0a24a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 "Noto Sans Ethiopic","Source Sans 3",system-ui,sans-serif}
header{background:var(--bg);color:var(--ink);padding:10px 18px 12px;border-bottom:1px solid var(--line);text-align:center}
.top{display:flex;justify-content:center;margin-bottom:6px}
.subw{margin-top:8px}
.logo{width:56px;height:56px;border-radius:50%;flex:none;background:#fff}
.ul{display:flex;justify-content:center;gap:6px;margin:8px 0 0}
.ul i{height:3px;border-radius:3px;background:#fd5a0f}
.ul i:first-child{width:60px}
.ul i:last-child{width:18px}
:root[data-theme=dark] header,:root:not([data-theme=light]) header{--hb:1}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:clamp(1rem,4vw,1.35rem);font-weight:700;line-height:1.35;margin:0}
.hl{color:inherit}
html[lang=am] h1{min-height:4.05em}
html[lang=en] h1{min-height:2.7em}
@media(min-width:640px){html[lang=am] h1{min-height:2.7em}html[lang=en] h1{min-height:1.35em}}
.sub{display:inline-flex;align-items:center;gap:9px;margin:0;padding:6px 16px 6px 12px;border:0;background:#fd5a0f;color:#fff;border-radius:999px;font-size:.82rem;font-weight:700;box-shadow:0 5px 12px rgba(0,0,0,.22)}
.sub svg{flex:none;width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 18px}
.bar .wrap{display:flex;gap:10px;align-items:center}
input{flex:1;min-width:0;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.lang{display:flex;border:1px solid var(--brand);border-radius:8px;overflow:hidden}
.lang button{font:inherit;font-weight:600;padding:8px 12px;border:0;background:transparent;color:var(--brand);cursor:pointer}
.lang button[aria-pressed=true]{background:var(--brand);color:var(--bg)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{padding:18px}
.notice{background:var(--card);border:1px solid var(--line);border-top:4px solid #e8173b;border-radius:12px;padding:18px;margin-bottom:22px}
.nh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.nh svg{flex:none;width:28px;height:28px;stroke:#e8173b;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nh h2{margin:0;font-size:1.08rem;line-height:1.4}
.notice p{margin:0 0 12px;font-size:.98rem}
.notice .w{background:rgba(232,23,59,.14);color:#e8173b;font-weight:700;padding:0 4px;border-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips span{border:1px solid #e8173b;color:#e8173b;border-radius:999px;padding:3px 12px;font-size:.88rem;font-weight:600}
.notice .nend{margin:0;padding-top:12px;border-top:1px dashed var(--line);font-weight:700;color:var(--brand)}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
summary{cursor:pointer;padding:14px 16px;font-weight:700;color:var(--brand);list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::after{content:"+";font-size:1.4rem;line-height:1}
details[open] summary::after{content:"−"}
summary::-webkit-details-marker{display:none}
ol{margin:0;padding:0 16px 8px;list-style:none}
li{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.n{flex:none;width:2.1rem;height:2.1rem;border-radius:50%;background:var(--brand);color:var(--bg);font-weight:700;font-size:.9rem;display:grid;place-items:center;margin-top:2px}
li b{display:block;color:var(--ink)}
li span{color:var(--mute)}
mark{background:var(--accent);color:#fff;border-radius:3px;padding:0 2px}
.none{text-align:center;color:var(--mute);padding:30px 0}
.cur{display:inline-block;width:3px;height:1.1em;background:var(--accent);margin-left:4px;vertical-align:-.15em;animation:bl 1s steps(1) infinite}
header .cur{background:#fd5a0f}
@keyframes bl{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.cur{animation:none}}
footer{padding:10px 18px 48px}
.note{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--accent);border-radius:10px;padding:16px 18px;color:var(--mute);font-size:.95rem}
.note h3{margin:0 0 6px;color:var(--accent);font-size:1.05rem}
.note p{margin:0}
.thanks{text-align:center;margin:36px 0 6px}
.big{font-size:2rem;font-weight:700;color:var(--brand);line-height:1.3;min-height:1.3em}
.rule{width:64px;height:3px;background:var(--accent);margin:12px auto 16px;border-radius:2px}
.sign{display:inline-block;background:#e8173b;color:#fff;padding:14px 36px;border-radius:999px;font-weight:700;font-size:1.05rem;box-shadow:0 8px 18px rgba(232,23,59,.35)}
.meta{text-align:center;color:var(--mute);font-size:.85rem;margin:22px 0 0}
</style>
</head>

 {t:"3. የደህንነት፣ የዕቃ ዝውውር እና የሰዓት ደንቦች",r:[

 "የደረጃዎች እና የኮሪደር ስነ-ስርዓት፦ ተከራዮች፣ ሰራተኞች ወይም እንግዶች በህንፃው ደረጃዎች ወይም ኮሪደሮች ላይ መቀመጥ፣ ጫጫታ መፍጠር ወይም የሰዎችን እንቅስቃሴ ማደናቀፍ አይፈቀድላቸውም።",
 "ያልተፈቀደ ፎቶ እና ቪዲዮ ክልከላ፦ በህንፃው ግቢ እና ኮሪደሮች ውስጥ ያለ አስተዳደሩ ፈቃድ ፎቶግራፍ ወይም ቪዲዮ ማንሳት በጥብቅ የተከለከለ ነው።",
 "የህንፃው የስራ ሰዓት፦ የህንፃው መክፈቻና መዝጊያ ሰዓት በአስተዳደሩ ይወሰናል ይህም ከ ጠዋት 12 ሰአት እስከ ምሽት 4 ሰአት ይሆናል። ከዚህ ሰዓት ውጭ ለመጠቀም የሚፈልግ ተከራይ የጥበቃ እና የሃይል ወጪዎችን በመሸፈን ልዩ ፈቃድ መጠየቅ ይኖርበታል።"]},
 {t:"4. የስነ-ምግባር፣ የአደጋ መከላከል እና ጥገና",r:[
 "የአደገኛ ቁሳቁሶች ክልከላ፦ በቀላሉ የሚቀጣጠሉ ኬሚካሎች፣ ጋዞች ወይም አደገኛ ህገ-ወጥ ቁሳቁሶችን በህንፃው ውስጥ ማከማቸት ወይም መጠቀም በፍጹም የተከለከለ ነው።",
 "የጥገና ሃላፊነት፦ በተከራዩ፣ በሰራተኞቹ ወይም በደንበኞቹ ምክንያት ለሚደርስ ማንኛውም የህንፃው አካል መጎዳት (ለምሳሌ የመብራት ስዊች፣ መስታወት፣ በሮች፣ ግድግዳዎች) ተከራዩ ሙሉ የጥገና ወጪውን የመሸፈን ሃላፊነት አለበት።",
 "የፀጥታ እና የስነ-ምግባር ደንብ፦ በህንፃው ግቢ ውስጥ ሌሎች ተከራዮችን የሚረብሽ ከፍተኛ ድምጽ መፍጠር፣ ጸብ መጫር፣ ስካር፣ ጫት መቃም፣ ማጨስ ወይም ኢ-ስነምግባራዊ ድርጊት መፈጸም በጥብቅ የተከለከለ ነው።",
 "ከጎረቤት ጋር መከባበር እና ሰላም መፍጠር፡ እያንዳንዱ ተከራይ ከጎረቤቶቹ ጋር በመከባበር የመስራት ግዴታ አለበት። የሌላኛውን ተከራይ ስም ማጥፋት፣ ስራ ማደናቀፍ ወይም በንግድ እንቅስቃሴው ላይ ጣልቃ መግባት ውልን ሊያሰርዝ የሚችል ጥፋት ነው።",
 "የደህንነት እና የፍተሻ መብት፡ አስተዳደሩ ለደህንነት ሲል በማንኛውም ሰዓት በህንፃው መግቢያ ላይ ፍተሻ የማድረግ እና አስፈላጊ ሆኖ ሲገኝ (በአስቸኳይ ጊዜ) ወደ ተከራዩ ክፍል የመግባት መብት አለው።",
 "የመኪና ማቆሚያ (Parking) እና እንስሳት ክልከላ፦ ተሽከርካሪዎችን በተመደበው ቦታ ብቻ ማቆም ግዴታ ሲሆን፣ ማንኛውንም አይነት የቤት እንስሳት ወደ ህንፃው ግቢ እና ቢሮዎች ማምጣት በጥብቅ የተከለከለ ነው።",
 "የጋራ መገልገያ ቁጠባ፦ በጋራ መጠቀሚያ ቦታዎች ላይ የውሃ ወይም የኤሌክትሪክ ብክነት እንዳይኖር የማድረግ እና ብልሽት ሲያጋጥም ለአስተዳደሩ የመጠቆም ኃላፊነት የሁሉም ተከራዮች ነው።"]}]},
en:{
 ui:{title:"Bereka Building: Tenants' Internal Regulations",hl:"Bereka Building",sub:"የበረካ ህንፃ የውስጥ መተዳደሪያ ደንብ",search:"Search the rules…",none:"No matching rule found",ver:"Version",upd:"Last updated",
 noticeTitle:"Enforcement and termination",noticeBody:"Violating these internal regulations gives the building administration full legal authority to terminate the lease without prior warning, apply penalties, and remove the tenant from the building.",warn:"without prior warning",chips:["Lease termination","Penalties","Removal from building"],noticeEnd:"These regulations are an inseparable part of the lease agreement.",
 noteLabel:"Notice",note:"These regulations are an inseparable part of the lease agreement and will be amended from time to time as needed.",thanks:"Thank you!",sign:"Bereka Building Manager"},
 sections:[
 {t:"1. Legal, contract and administrative rules",r:[
 "Valid business license: No tenant may start operating in the building without a valid, legally issued business license. Working outside the business activity stated in the lease, or changing the business type, requires the administration's approval.",
 "No opening of sealed units: Opening a unit sealed or locked by the administration or legal authorities, without proper permission, is an offense that ends the lease immediately and may lead to legal action.",
 "Communication protocol: Every complaint, request or comment to the administration must be submitted in writing (letter or email). Verbal requests are not accepted.",
 "Payment discipline: Rent and service charges (electricity, water, generator) must be paid within the deadline set in the lease. If payment is late, the administration reserves the right to take legal action without further warning.",
 "No subletting: A tenant may not sublet, hand over, or appoint an agent for the rented unit, in whole or in part, to a third party.",
 "Responsibility for customers and guests: Tenants are fully responsible for making their customers and guests follow the building rules. Offenses by a customer or employee are treated as the tenant's offense."]},
 {t:"2. Building use, cleanliness and appearance",r:[
 "No renovation or alteration without permission: Any renovation, wall drilling, change or addition to the building, units, exterior walls or utilities (electricity, water, internet) without the administration's written permission is strictly prohibited.",
 "Shared areas: Placing or storing goods, cartons, furniture or clothes in corridors, stairs and shared areas is never allowed.",
 "Entrances: Blocking the building entrance or its view and security movement with mannequins, boxes or other items is strictly prohibited.",
 "Cleanliness and hygiene: Tenants must keep their unit, exterior glass and door clean at all times, prevent pests, and cooperate in the administration's cleaning campaigns.",
 "Waste disposal: Dry and wet waste must be disposed of only in the designated place. Leaving waste in corridors or on stairs is prohibited.",
 "Toilets: Tenants and their staff must use the toilets on each floor carefully, so that open doors do not cause water waste, poor hygiene or damage.",
 "Exterior appearance and color: The color or design of a unit's exterior wall, glass and doors may not be changed without the administration's permission.",
 "Signs and advertising: Advertisements, branding and signs placed outside an office or shop must keep the building's uniform look and be approved by the administration."]},
 {t:"3. Security, movement of goods and hours",r:[
 "Pass Permit and inspection: Any item or property leaving the building requires a valid Pass Permit signed by the administration or the owner, and must be inspected by the guards.",
 "Loading and unloading hours: Heavy goods or shop products may be brought in or taken out only at times that do not disturb normal business activity, as set by the administration.",
 "Elevator use: The elevator is for carrying people. Loading heavy cargo, luggage or merchandise is not allowed.",
 "Unauthorized visitors: Letting beggars or door-to-door sellers (including goods/jebena vendors) into the building is strictly prohibited.",
 "Stairs and corridors: Tenants, staff and guests may not sit, make noise, or obstruct movement on the stairs or corridors.",
 "Photos and video: Taking photos or video in the compound and corridors without the administration's permission is strictly prohibited.",
 "Opening hours: Opening and closing times are set by the administration, from 12:00 in the morning to 4:00 in the evening (Ethiopian time). A tenant who needs to use the building outside these hours must ask for special permission and cover the security and power costs."]},
 {t:"4. Conduct, hazard prevention and maintenance",r:[
 "Hazardous materials: Storing or using flammable chemicals, gases or dangerous illegal materials in the building is strictly prohibited.",
 "Maintenance responsibility: The tenant pays the full repair cost for any damage to the building (for example light switches, glass, doors, walls) caused by the tenant, staff or customers.",
 "Peace and conduct: Loud noise that disturbs other tenants, fighting, drunkenness, chewing khat, smoking, or any improper behavior in the compound is strictly prohibited.",
 "Respect for neighbors: Every tenant must work respectfully with neighbors. Defaming another tenant, obstructing their work, or interfering with their business is an offense that may end the lease.",
 "Security and inspection right: For security, the administration may inspect people at the building entrance at any time and, in an emergency, may enter a tenant's unit if necessary.",
 "Parking and animals: Vehicles must be parked only in the assigned area. Bringing any pets into the compound or offices is strictly prohibited.",
 "Saving shared utilities: All tenants are responsible for preventing water or electricity waste in shared areas and for reporting any fault to the administration."]}]}
};
/* ===== APP ===== */
const $=id=>document.getElementById(id);
let lang="am",term="";
try{lang=localStorage.getItem("bereka-lang")||"am"}catch(e){}
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function hl(s){if(!term)return esc(s);const i=s.toLowerCase().indexOf(term);return i<0?esc(s):esc(s.slice(0,i))+"<mark>"+esc(s.slice(i,i+term.length))+"</mark>"+esc(s.slice(i+term.length))}
const timers={};
function typeInto(el,text){clearInterval(timers[el.id]);const c=Array.from(text);
 if(matchMedia("(prefers-reduced-motion:reduce)").matches){el.textContent=text;return}
 let i=0;el.textContent="";timers[el.id]=setInterval(()=>{el.textContent+=c[i++];if(i>=c.length)clearInterval(timers[el.id])},c.length>20?65:90)}
function typeLoop(el,text,hl){clearTimeout(timers[el.id]);const c=Array.from(text),pl=Array.from(hl).length;
 const draw=n=>{el.innerHTML='<span class="hl">'+esc(c.slice(0,Math.min(n,pl)).join(""))+'</span>'+esc(c.slice(pl,n).join(""))};
 if(matchMedia("(prefers-reduced-motion:reduce)").matches){draw(c.length);return}
 let i=0,del=false;
 (function step(){draw(i);let d=del?35:80;
  if(!del&&i===c.length){del=true;d=1800}
  else if(del&&i===0){del=false;d=500}
  else i+=del?-1:1;
  timers[el.id]=setTimeout(step,d)})()}
let vis=false,typed=false;
function maybeThanks(){if(vis&&!typed){typed=true;typeInto($("th"),DATA[lang].ui.thanks)}}
new IntersectionObserver(e=>{vis=e[0].isIntersecting;maybeThanks()},{threshold:.6}).observe($("tk"));
function render(re){
 const d=DATA[lang],u=d.ui;
 document.documentElement.lang=lang;
 $("h1").setAttribute("aria-label",u.title);$("s").textContent=u.sub;
 if(re){typeLoop($("tt"),u.title,u.hl);typed=false;$("th").textContent="";maybeThanks()}$("ntt").textContent=u.noticeTitle;const wb=u.noticeBody.split(u.warn);$("nbody").innerHTML=esc(wb[0])+'<span class="w">'+esc(u.warn)+'</span>'+esc(wb[1]);$("chips").innerHTML=u.chips.map(c=>"<span>"+esc(c)+"</span>").join("");$("ne").textContent=u.noticeEnd;
 $("nl").textContent=u.noteLabel;$("nb").textContent=u.note;$("sg").textContent=u.sign;$("ver").textContent=u.ver+" "+VERSION+" · "+u.upd+": "+UPDATED;
 $("q").placeholder=u.search;$("q").setAttribute("aria-label",u.search);
 document.title=u.title;
 document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===lang));
 let n=0,out="",found=0;
 d.sections.forEach(sec=>{
  let items="";
  sec.r.forEach(r=>{n++;
   if(term&&!r.toLowerCase().includes(term))return;
   found++;
   const m=r.match(/^(.*?)[፦፡:]\s*(.*)$/s);
   items+=`<li><div class="n">${n}</div><div><b>${hl(m?m[1]:"")}</b><span>${hl(m?m[2]:r)}</span></div></li>`});
  if(items)out+=`<details ${term||sec===d.sections[0]?"open":""}><summary>${esc(sec.t)}</summary><ol>${items}</ol></details>`});
 $("list").innerHTML=found?out:`<div class="none">${u.none}</div>`;
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{lang=b.dataset.l;try{localStorage.setItem("bereka-lang",lang)}catch(e){}render(true)});
$("q").oninput=e=>{term=e.target.value.trim().toLowerCase();render()};
render(true);
</script>
